name: Django CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install flake8
      - run: |
          cat << EOF > .flake8
          [flake8]
          max-line-length = 120
          ignore = E203,E266,W503,E501,C901
          exclude = .git,__pycache__,migrations,venv,.venv,env,.env,.github,scripts,docs,build,dist
          EOF
      - run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python manage.py test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          echo "SSH key: ${{ secrets.SSH_KEY != '' }}"
          echo "SSH user: ${{ secrets.SSH_USER || 'NOT_SET' }}"
          echo "Server IP: ${{ secrets.SERVER_IP || 'NOT_SET' }}"
          echo "Deploy dir: ${{ secrets.DEPLOY_DIR || 'NOT_SET' }}"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy via Docker Compose
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            docker-compose down
            docker-compose pull || true
            docker-compose up -d --build
            docker-compose exec web python manage.py migrate
            docker-compose exec web python manage.py collectstatic --noinput
          EOF